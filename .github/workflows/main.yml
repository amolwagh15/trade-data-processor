name: Automated Trade Validation Pipeline

on: 
  push:
    branches:
      - main
      - develop
      - enhance
  pull_request:
    branches:
      - main

jobs:
  build_validate_report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Run Validation Script
      run: |
        python3 src/scripts/validate_trade.py

    - name: Upload Reports
      uses: actions/upload-artifact@v6
      with:
        name: validation-reports
        path: output/
        retention-days: 7

